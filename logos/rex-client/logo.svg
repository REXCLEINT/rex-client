<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4be0"/>
      <stop offset="0.55" stop-color="#2b579a"/>
      <stop offset="1" stop-color="#1f8a55"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <!-- Isometrischer Block (Gras/Erde) -->
  <g transform="translate(256 210)">
    <!-- Oberseite -->
    <polygon points="0,-120 120,-60 0,0 -120,-60" fill="#7ed957"/>
    <polygon points="0,-120 60,-90 0,-60 -60,-90" fill="#93e86a"/>
    <polygon points="60,-90 120,-60 60,-30 0,-60" fill="#6cc94a"/>
    <polygon points="-60,-90 0,-60 -60,-30 -120,-60" fill="#6cc94a"/>
    <!-- Linke Seite -->
    <polygon points="-120,-60 0,0 0,140 -120,80" fill="#8b5a2b"/>
    <polygon points="-120,-60 0,0 0,30 -120,-30" fill="#5fb43f"/>
    <rect x="-90" y="40" width="20" height="20" fill="#74461f" transform="skewY(26.565)"/>
    <rect x="-50" y="60" width="20" height="20" fill="#74461f" transform="skewY(26.565)"/>
    <!-- Rechte Seite -->
    <polygon points="120,-60 0,0 0,140 120,80" fill="#6b4220"/>
    <polygon points="120,-60 0,0 0,30 120,-30" fill="#4c9a33"/>
    <rect x="40" y="70" width="20" height="20" fill="#56351a" transform="skewY(-26.565)"/>
    <rect x="80" y="110" width="20" height="20" fill="#56351a" transform="skewY(-26.565)"/>
    <!-- Kanten -->
    <polyline points="-120,-60 0,0 120,-60" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#000" stroke-opacity=".2" stroke-width="3"/>
  </g>
  <text x="256" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="8">REX</text>
  <text x="256" y="466" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="26" fill="#ffffff" fill-opacity=".85" letter-spacing="10">CLIENT</text>
</svg>
