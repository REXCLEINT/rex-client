<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>REX Office</title>
<link rel="stylesheet" href="css/common.css">
<style>
  body { overflow: auto; user-select: none; }
  .home-top {
    background: linear-gradient(135deg, #5b3fd1 0%, #2b579a 55%, #217346 100%); color: #fff; padding: 34px 48px 74px; position: relative;
  }
  .home-top h1 { margin: 0; font-weight: 300; font-size: 34px; letter-spacing: .3px; }
  .home-top p { margin: 6px 0 0; opacity: .85; font-size: 15px; }
  .home-top .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; font-weight: 700; font-size: 18px; }
  .home-top .logo b { width: 38px; height: 38px; border-radius: 9px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 18px; }
  .home-top .tools { position: absolute; right: 30px; top: 26px; display: flex; gap: 6px; }
  .home-top .tools button { background: rgba(255,255,255,.15); border: 0; color: #fff; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
  .home-top .tools button:hover { background: rgba(255,255,255,.28); }
  .wrap { max-width: 1060px; margin: -48px auto 40px; padding: 0 24px; position: relative; }
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .app {
    background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; cursor: pointer; border: 2px solid transparent;
    display: flex; flex-direction: column; gap: 10px; transition: transform .12s, border-color .12s; text-align: left; color: var(--text);
  }
  .app:hover { transform: translateY(-2px); border-color: var(--c); }
  .app .ico { width: 52px; height: 52px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
  .app h2 { margin: 6px 0 0; font-size: 19px; font-weight: 600; }
  .app p { margin: 0; color: var(--text-2); line-height: 1.45; }
  .app .fmt { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .app .fmt span { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); font-weight: 600; }
  :root[data-theme="dark"] .app .fmt span { color: color-mix(in srgb, var(--c) 45%, #fff); }
  .section { margin-top: 30px; }
  .section h3 { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .section h3 .grow { flex: 1; }
  .open-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; color: var(--text); }
  .open-btn:hover { border-color: var(--accent); }
  .recent { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .recent button { display: flex; width: 100%; gap: 14px; align-items: center; padding: 11px 16px; border: 0; border-bottom: 1px solid var(--border); background: none; cursor: pointer; text-align: left; color: var(--text); }
  .recent button:last-child { border-bottom: 0; }
  .recent button:hover { background: var(--hover); }
  .recent .badge { width: 28px; height: 28px; border-radius: 6px; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .recent .path { color: var(--text-2); font-size: 11px; }
  .empty { padding: 26px; text-align: center; color: var(--text-2); }
  .drop-hint { margin-top: 18px; text-align: center; color: var(--text-2); font-size: 12px; }
  body.dragging .wrap { outline: 3px dashed var(--accent); outline-offset: 8px; border-radius: 12px; }
  @media (max-width: 760px) { .apps { grid-template-columns: 1fr; } }
</style>
</head>
<body class="app-home">
  <div class="home-top">
    <div class="logo"><b>R</b> REX Office</div>
    <h1 id="greet">Willkommen</h1>
    <p>Texte, Tabellen und Präsentationen – kompatibel mit Word, Excel und PowerPoint.</p>
    <div class="tools">
      <button id="themeBtn" title="Hell/Dunkel"><i data-lucide="moon"></i></button>
    </div>
  </div>
  <div class="wrap">
    <div class="apps">
      <button class="app" data-app="writer" style="--c:#2b579a">
        <div class="ico">T</div>
        <h2>REX Text</h2>
        <p>Briefe, Referate, Bewerbungen und Berichte schreiben – mit Formatvorlagen, Tabellen, Bildern und Inhaltsverzeichnis.</p>
        <div class="fmt"><span>.docx</span><span>PDF</span><span>.txt</span><span>.html</span></div>
      </button>
      <button class="app" data-app="calc" style="--c:#217346">
        <div class="ico">X</div>
        <h2>REX Tabelle</h2>
        <p>Rechnen mit über 100 Formeln (SUMME, WENN, SVERWEIS …), Diagramme, Sortieren, Filtern und mehrere Tabellenblätter.</p>
        <div class="fmt"><span>.xlsx</span><span>.csv</span><span>PDF</span></div>
      </button>
      <button class="app" data-app="present" style="--c:#c43e1c">
        <div class="ico">P</div>
        <h2>REX Präsentation</h2>
        <p>Folien mit Designs, Formen, Bildern, Tabellen und Diagrammen gestalten und im Vollbild mit Übergängen präsentieren.</p>
        <div class="fmt"><span>.pptx</span><span>PDF</span></div>
      </button>
    </div>

    <div class="section">
      <h3><span class="grow">Zuletzt verwendet</span>
        <button class="open-btn" id="openBtn"><i data-lucide="folder-open"></i> Datei öffnen</button></h3>
      <div class="recent" id="recent"><div class="empty">Noch keine Dateien geöffnet.</div></div>
      <div class="drop-hint">Tipp: Du kannst Word-, Excel- und PowerPoint-Dateien auch einfach hierher ziehen.</div>
    </div>
  </div>

<script src="vendor/lucide.min.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
